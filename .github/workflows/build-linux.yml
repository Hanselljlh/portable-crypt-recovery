name: Build Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller packaging/linux/pyinstaller-one-folder.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCR-linux
          path: dist/
