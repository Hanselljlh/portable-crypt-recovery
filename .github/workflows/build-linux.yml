name: Build Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: false
        default: "0.0.0"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"
          if [ -z "$V" ]; then V="${{ inputs.version || '0.0.0' }}"; fi
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"

      - name: Build portable release
        run: |
          chmod +x packaging/linux/build.sh
          bash packaging/linux/build.sh "${{ steps.ver.outputs.VERSION }}"

      - name: Generate checksums
        run: python3 scripts/make_checksums.py dist

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCR-linux-portable-${{ steps.ver.outputs.VERSION }}
          path: dist/PCR-linux-portable-*.tar.gz

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS-linux
          path: dist/SHA256SUMS.txt
