name: Build Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.2)"
        required: false
        default: "0.0.0"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller
          python3 -m pip install -e .

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"
          if [ -z "$V" ]; then V="${{ inputs.version || '0.0.0' }}"; fi
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"

      - name: Build portable release
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x packaging/linux/build.sh
          bash packaging/linux/build.sh "${{ steps.ver.outputs.VERSION }}"

      - name: Generate checksums
        run: python3 scripts/make_checksums.py dist

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCR-linux-portable-${{ steps.ver.outputs.VERSION }}
          path: dist/PCR-linux-portable-*.tar.gz

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS-linux
          path: dist/SHA256SUMS.txt
