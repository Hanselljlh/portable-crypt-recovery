name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── Windows portable build ─────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -match "^v") { $v = $v.Substring(1) }
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e .

      - name: Build portable release
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .\packaging\windows\build.ps1 -Version "${{ steps.ver.outputs.VERSION }}" -PyExePath python

      - name: Generate checksums
        shell: pwsh
        run: python scripts/make_checksums.py dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ steps.ver.outputs.VERSION }}
          path: |
            dist/PCR-windows-portable-*.zip
            dist/SHA256SUMS.txt

  # ── Linux portable build ───────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgl1 \
            libegl1 \
            libglib2.0-0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller
          python3 -m pip install -e .

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"

      - name: Build portable release
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x packaging/linux/build.sh
          bash packaging/linux/build.sh "${{ steps.ver.outputs.VERSION }}"

      - name: Generate checksums
        run: python3 scripts/make_checksums.py dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ steps.ver.outputs.VERSION }}
          path: |
            dist/PCR-linux-portable-*.tar.gz
            dist/SHA256SUMS.txt

  # ── GitHub Release ─────────────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.ref_name }}"
          V="${V#v}"
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ steps.ver.outputs.VERSION }}
          path: release/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-${{ steps.ver.outputs.VERSION }}
          path: release/

      - name: List release assets
        run: ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.ver.outputs.VERSION }}"
          body: |
            ## Portable Crypt Recovery v${{ steps.ver.outputs.VERSION }}

            See [docs/user-guide/getting-started.md](https://github.com/${{ github.repository }}/blob/main/docs/user-guide/getting-started.md) for setup instructions.

            ### Quick start
            1. Extract the zip (Windows) or tarball (Linux)
            2. Place `hashcat.exe` / `hashcat` in `tools/hashcat/`
            3. Run `PCR.exe` / `./PCR`
            4. Settings → Hashcat Setup → Verify
            5. Add a target, extract headers, create a job, run the queue

            > Hashcat is **not** bundled. Download from https://hashcat.net/hashcat/ and verify checksums.
            > See [docs/safety-notes.txt](https://github.com/${{ github.repository }}/blob/main/docs/safety-notes.txt) — authorized use only.
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
