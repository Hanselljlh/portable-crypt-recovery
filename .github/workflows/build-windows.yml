name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: false
        default: "0.0.0"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -match "^v") { $v = $v.Substring(1) }
          if (-not $v -or $v -eq "") { $v = "${{ inputs.version || '0.0.0' }}" }
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT

      - name: Build portable release
        shell: pwsh
        run: |
          .\packaging\windows\build.ps1 -Version "${{ steps.ver.outputs.VERSION }}" -PyExePath python

      - name: Generate checksums
        shell: pwsh
        run: python scripts/make_checksums.py dist

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCR-windows-portable-${{ steps.ver.outputs.VERSION }}
          path: dist/PCR-windows-portable-*.zip

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS-windows
          path: dist/SHA256SUMS.txt
