[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-crypt-recovery"
version = "0.1.27"
description = "A local, portable Windows and Linux GUI for authorized VeraCrypt and TrueCrypt volume recovery using Hashcat."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Portable Crypt Recovery contributors" }
]
dependencies = [
  "PySide6>=6.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5"
]

[project.scripts]
pcr = "portable_crypt_recovery.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# UI views use pragma: no cover and contain unavoidably long Qt call chains
"src/portable_crypt_recovery/ui/*.py" = ["E501"]
# E741 ambiguous name 'l' in list comprehensions is acceptable in UI code
"src/portable_crypt_recovery/ui/cleanup_view.py" = ["E501", "E741"]
